name: CI

# Trigger the workflow on push or pull request or manually
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref_name != github.event.repository.default_branch || github.run_number }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  # GAP-side .tst tests across the supported version matrix and three OSes.
  # On Windows, GAP runs under Cygwin via gap-actions/setup-cygwin (same as
  # the io package; the kernel itself is Cygwin-only on Windows).
  test:
    name: ${{ matrix.os }} - GAP ${{ matrix.gap-version }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu]
        gap-version:
          - 'devel'   # current GAP development version from git
          - 'latest'  # latest GAP release
          - 'minimal' # oldest GAP release supported by this package
        include:
          - os: macos
            gap-version: 'devel'
          - os: windows
            gap-version: 'devel'
    steps:
      - uses: actions/checkout@v6
      - name: 'Install libzmq (Linux)'
        if: ${{ runner.os == 'Linux' }}
        run: sudo apt-get install -y libzmq3-dev
      - name: 'Install zeromq (macOS)'
        if: ${{ runner.os == 'macOS' }}
        run: brew install zeromq
      - uses: gap-actions/setup-cygwin@v2
        if: ${{ runner.os == 'Windows' }}
        with:
          # ZeroMQInterface's configure does AC_CHECK_HEADER(zmq.h) +
          # -lzmq, so libzmq-devel is the only Cygwin package we need
          # beyond the setup-cygwin defaults.
          extra-pkgs-to-install: 'libzmq-devel'
      - uses: gap-actions/setup-gap@v3
        with:
          gap-version: ${{ matrix.gap-version }}
      - uses: gap-actions/build-pkg@v3
        with:
          extra-pkgs: "io profiling crypting json ZeroMQInterface"
      - uses: gap-actions/run-pkg-tests@v4
      - uses: gap-actions/run-pkg-tests@v4
        with:
          mode: onlyneeded
      - uses: gap-actions/process-coverage@v3
        if: ${{ runner.os == 'Linux' && matrix.gap-version == 'devel' }}
      - uses: codecov/codecov-action@v6
        if: ${{ runner.os == 'Linux' && matrix.gap-version == 'devel' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # End-to-end protocol tests via jupyter_kernel_test (drives the kernel
  # over real ZMQ). Linux + macOS only — on Windows, GAP runs under Cygwin
  # but Jupyter typically runs in native Python, and crossing those two
  # environments via subprocess is fragile. Notebook-7 + GAP on Windows
  # remains a separate hardening task.
  python-test:
    name: jupyter_kernel_test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos]
    steps:
      - uses: actions/checkout@v6
      - name: 'Install libzmq + graphviz (Linux)'
        if: ${{ runner.os == 'Linux' }}
        # graphviz provides `dot`, used by JupyterSplashDot in the demo
        # notebooks executed below.
        run: sudo apt-get install -y libzmq3-dev graphviz
      - name: 'Install zeromq + graphviz (macOS)'
        if: ${{ runner.os == 'macOS' }}
        run: brew install zeromq graphviz
      - uses: gap-actions/setup-gap@v3
        with:
          gap-version: 'devel'
      - uses: gap-actions/build-pkg@v3
        with:
          extra-pkgs: "io profiling crypting json ZeroMQInterface"
      - name: 'Replace bundled JupyterKernel with checkout'
        # setup-gap's bootstrap-pkg-full unpacks every standard package,
        # including the released JupyterKernel. Without this step,
        # LoadPackage("JupyterKernel") in the kernel launcher would
        # find that copy instead of the working tree.
        run: |
          rm -rf "$HOME"/gap/pkg/[Jj]upyter[Kk]ernel*
          ln -s "$GITHUB_WORKSPACE" "$HOME/gap/pkg/JupyterKernel"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          # Node is needed during the editable install: hatch_jupyter_builder
          # invokes `npm install && npm run build:prod` to compile the
          # JupyterLab CodeMirror labextension that ships with the kernel.
          node-version: '20'
      - name: 'Install kernel + test deps'
        run: |
          pip install -e '.[test]'
          jupyter kernelspec install --user etc/jupyter --name gap-4
      - name: 'Run jupyter_kernel_test'
        run: pytest tst/python/ -v
      - name: 'Execute demo notebooks'
        # Cheap end-to-end smoke test: run every demo notebook against
        # the freshly-installed kernel and fail the job if any cell
        # raises. Catches regressions in the help-magic dispatch
        # (`?topic`), in JupyterSplashDot, and in any rendering glue
        # the demos exercise — all things we have no unit-test cover
        # for.
        run: |
          set -e
          for nb in demos/*.ipynb; do
            echo "=== $nb ==="
            jupyter nbconvert --to notebook --execute "$nb" \
                --output "/tmp/$(basename "$nb" .ipynb).executed.ipynb" \
                --ExecutePreprocessor.timeout=120
          done

  # Independent smoke test that the labextension still builds end-to-end
  # in production mode. The python-test job exercises the editable build;
  # this one exercises the wheel build path that end users hit.
  labextension-build:
    name: labextension build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 'Build the wheel'
        run: |
          pip install build
          python -m build --wheel
      - name: 'Confirm the wheel ships the prebuilt labextension'
        run: |
          set -e
          wheel=$(ls dist/*.whl | head -1)
          python -m zipfile -l "$wheel" | grep 'share/jupyter/labextensions/jupyterlab-gap-mode/static/style.js'
          python -m zipfile -l "$wheel" | grep 'share/jupyter/kernels/gap-4/kernel.json'
      - name: 'Smoke-test the installed wheel with JupyterLab and Notebook'
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl | head -1)
          python -m venv /tmp/gap-jupyter-wheel-test
          /tmp/gap-jupyter-wheel-test/bin/pip install "$wheel" 'jupyterlab>=4,<5' 'notebook>=7'

          kernels=$(/tmp/gap-jupyter-wheel-test/bin/jupyter kernelspec list --json)
          echo "$kernels"
          grep -q '"gap-4"' <<< "$kernels"

          extensions=$(/tmp/gap-jupyter-wheel-test/bin/jupyter labextension list 2>&1)
          echo "$extensions"
          grep -q 'jupyterlab-gap-mode' <<< "$extensions"
          grep -Eq 'enabled.*OK' <<< "$extensions"

          /tmp/gap-jupyter-wheel-test/bin/jupyter lab --version
          /tmp/gap-jupyter-wheel-test/bin/jupyter notebook --version
